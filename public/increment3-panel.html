<!-- Fragmento fuente incorporado en index.html por scripts/build-increment3.cjs -->
<div class="modal-overlay v3-overlay" x-cloak x-show="v3Open" @click.self="v3Close()" role="dialog" aria-modal="true" aria-label="Gestión administrativa">
<section class="modal-box v3-panel">
 <button type="button" class="close-btn" aria-label="Cerrar gestión" @click="v3Close()" x-show="!v3MustReset">×</button>
 <h2 class="modal-title" x-text="v3Title"></h2>
 <p class="v3-message" role="status" :class="{'v3-error':v3Error}" x-text="v3Busy?'Procesando…':v3Message"></p>
 <fieldset :disabled="v3Busy" class="v3-content">
 <template x-if="v3Tab==='profile'"><div>
  <dl class="v3-profile"><template x-for="key in ['nombre','rut','username','correo','rol','cargo']"><div><dt x-text="key"></dt><dd x-text="v3Form[key]||'Sin indicar'"></dd></div></template></dl>
  <p>El nombre, RUT y nombre de usuario son de solo lectura.</p>
  <label>Área<input x-model="v3Form.area" maxlength="100"></label><label>Piso<input x-model="v3Form.piso" maxlength="50"></label>
  <button class="btn btn-green" @click="v3SaveProfile()">Guardar área y piso</button> <button class="btn btn-outline" @click="v3OpenSection('password')">Cambiar contraseña</button>
 </div></template>
 <template x-if="v3Tab==='password'"><div>
  <p x-show="v3MustReset">Debes cambiar tu contraseña temporal antes de usar el sistema.</p>
  <label x-show="!v3MustReset">Contraseña actual<input type="password" x-model="v3Form.current" autocomplete="current-password"></label>
  <label>Nueva contraseña<input type="password" x-model="v3Form.password" minlength="8" maxlength="72" autocomplete="new-password"></label>
  <label>Repetir nueva contraseña<input type="password" x-model="v3Form.confirm" autocomplete="new-password"></label>
  <button class="btn btn-green" @click="v3Password()">Guardar contraseña</button>
 </div></template>
 <template x-if="v3Tab==='categories'"><div>
  <div class="v3-table"><table><thead><tr><th>Categoría</th><th>Estado</th><th>Acción</th></tr></thead><tbody><template x-for="row in v3Rows" :key="row.category_id"><tr><td x-text="row.category_name"></td><td x-text="row.is_active?'Activa':'Inactiva'"></td><td><button class="btn btn-outline" @click="v3Selected=row.category_id;v3Form={nombre:row.category_name,activo:!!row.is_active}">Editar</button></td></tr></template></tbody></table></div>
  <div x-show="v3Selected"><label>Nombre<input x-model="v3Form.nombre" maxlength="100"></label><label><input type="checkbox" x-model="v3Form.activo"> Activa para nuevos tickets</label><button class="btn btn-green" @click="v3SaveCategory()">Guardar categoría</button></div>
 </div></template>
 <template x-if="v3Tab==='config'"><div>
  <label>Límite de evidencia (1–50 MB)<input type="number" min="1" max="50" x-model.number="v3Form.upload_mb"></label>
  <label>Límite de manual (1–100 MB)<input type="number" min="1" max="100" x-model.number="v3Form.manual_mb"></label>
  <label>Umbral de aprobación de costos (0–100000000)<input type="number" min="0" max="100000000" x-model.number="v3Form.cost_threshold"></label>
  <label>Capacidad máxima por técnico (3 tickets)<input type="number" readonly x-model.number="v3Form.saturation"></label>
  <button class="btn btn-green" @click="v3SaveConfig()">Aplicar parámetros</button>
 </div></template>
 <template x-if="v3Tab==='import'"><div>
  <p>Excel de hasta 5 MB y 1000 filas. Se importan las filas válidas y se informa cada rechazo. Las cuentas nuevas reciben el rol Usuario y cambio obligatorio de contraseña.</p>
  <button class="btn btn-outline" @click="v3TemplateFile()">Descargar plantilla Excel</button>
  <label>Archivo .xlsx<input type="file" accept=".xlsx" x-ref="v3Excel"></label><button class="btn btn-green" @click="v3Import()">Importar Excel</button>
  <button class="btn btn-outline" x-show="v3Errors.length" @click="v3DownloadErrors()">Descargar errores CSV</button>
  <ul><template x-for="e in v3Errors"><li x-text="'Fila '+e.fila+': '+e.error"></li></template></ul>
 </div></template>
 <template x-if="v3Tab==='archives'"><div>
  <p>Registros archivados de solo lectura. La búsqueda textual usa el índice de texto de MySQL.</p>
  <div class="v3-filter"><label>Texto o código<input x-model="v3Filter.q"></label><label>Desde<input type="date" x-model="v3Filter.desde"></label><label>Hasta<input type="date" x-model="v3Filter.hasta"></label><label>Categoría<select x-model="v3Filter.category_id"><option value="">Todas</option><template x-for="c in v3Categories"><option :value="c.category_id" x-text="c.category_name"></option></template></select></label></div>
  <button class="btn btn-green" @click="v3SearchArchive()">Buscar archivados</button>
  <button class="btn btn-outline" x-show="usuario?.permisos==='si'" @click="v3Job('archive')">Ejecutar archivado de cerrados &gt;30 días</button>
  <p x-show="!v3Rows.length&&!v3Busy">No hay registros para estos filtros.</p>
  <template x-for="r in v3Rows" :key="r.ticket_code"><article class="v3-card"><strong x-text="r.ticket_code"></strong> <span x-text="r.title"></span> <button class="btn btn-outline" @click="v3ReadArchive(r.ticket_code)">Consultar</button></article></template>
  <template x-if="v3Detail?.ticket"><article class="v3-card"><h3 x-text="v3Detail.ticket.ticket_code+' · Solo lectura'"></h3><p x-text="v3Detail.ticket.description"></p><template x-for="c in v3Detail.comments"><p x-text="c.texto||c.content"></p></template></article></template>
 </div></template>
 <template x-if="v3Tab==='jobs'||v3Tab==='integrations'"><div>
  <template x-if="v3Tab==='integrations'"><div><button class="btn btn-outline" @click="v3OpenSection('integrationActivity')">Ver actividad de correo y cuentas sincronizadas</button><p>Los conectores utilizan credenciales del servidor. No se exponen en el navegador.</p><p x-text="'Correo IMAP: '+(v3Integrations.imap?'Configurado; sondeo cada 60 segundos':'No configurado')"></p><p x-text="'LDAP/AD: '+(v3Integrations.ldap?'Configurado; sincronización diaria':'No configurado')"></p><p x-text="'WhatsApp: '+(v3Integrations.whatsapp?'Configurado':'No configurado')"></p><button class="btn btn-outline" @click="v3Job('mail')">Consultar correo ahora</button> <button class="btn btn-outline" @click="v3Job('directory')">Sincronizar directorio ahora</button></div></template>
  <p x-show="v3Tab==='jobs'">Archivado diario a las 02:00 y mantenimiento semanal a las 03:00, hora de Chile, mientras el servidor está encendido. El mantenimiento purga evidencias eliminadas hace más de 48 horas.</p>
  <button x-show="v3Tab==='jobs'" class="btn btn-green" @click="v3Job('maintenance')">Ejecutar mantenimiento</button>
  <template x-for="r in v3Rows" :key="r.name"><article class="v3-card"><h3 x-text="v3JobName(r.name)"></h3><p x-text="'Último éxito: '+v3Date(r.last_success)"></p><p x-text="v3JobSummary(r.result,r.name)"></p></article></template>
 </div></template>
 <template x-if="v3Tab==='logs'"><div><button class="btn btn-outline" @click="v3OpenSection('backup')">Consultar respaldo local de errores</button><p>Los fallos críticos requieren revisión administrativa. Los secretos se omiten del contexto técnico.</p><p x-show="!v3Rows.length">Sin fallos registrados.</p><template x-for="r in v3Rows" :key="r.id"><article class="v3-card"><p x-text="v3Date(r.created_at)"></p><strong x-text="r.severity==='critical'?'Incidente crítico registrado':'Error registrado'"></strong><p x-text="v3LogMessage(r)"></p><p>El detalle técnico se conserva en el registro para diagnóstico.</p></article></template></div></template>
 <template x-if="v3Tab==='trash'||v3Tab==='attachments'"><div><p>La restauración está disponible durante las primeras 48 horas, si el archivo sigue existiendo.</p><p x-show="!v3Rows.length">No hay evidencias en esta vista.</p><template x-for="r in v3Rows" :key="r.attachment_id"><article class="v3-card"><strong x-text="r.file_name"></strong><p x-text="r.ticket_code||detTicket?.id_ticket"></p><p x-text="r.purged_at?'Archivo purgado':r.deleted_at?'Eliminado: '+v3Date(r.deleted_at):'Disponible'"></p><button class="btn btn-outline" x-show="!r.deleted_at&&v3Tab==='attachments'" @click="v3Attachment(r.attachment_id,'delete')">Enviar a papelera</button><button class="btn btn-green" x-show="r.deleted_at&&!r.purged_at" @click="v3Attachment(r.attachment_id,'restore')">Restaurar</button></article></template></div></template>
 <template x-if="v3Tab==='templates'"><div><label>Canal<select x-model="v3Form.channel" @change="v3ChooseTemplate()"><option value="email">Correo</option><option value="whatsapp">WhatsApp</option></select></label><p>Variables: {{usuario}}, {{nombre_ticket}}, {{contenido}}. Los correos aplican la plantilla a los avisos futuros.</p><label>Contenido HTML<textarea rows="9" x-model="v3Form.body"></textarea></label><button class="btn btn-green" @click="v3SaveTemplate()">Guardar plantilla</button><label>Destino para prueba (correo o número internacional)<input x-model="v3Form.destino"></label><button class="btn btn-outline" @click="v3TestTemplate()">Enviar prueba al destino indicado</button></div></template>
 <template x-if="v3Tab==='surveys'"><div><label>Una pregunta por línea (máximo 10)<textarea rows="6" x-model="v3Questions"></textarea></label><button class="btn btn-green" @click="v3SaveSurvey()">Publicar nueva versión</button><button class="btn btn-outline" @click="v3SurveyResults()">Consultar respuestas históricas</button><template x-for="r in v3Rows" :key="r.id"><article class="v3-card"><strong x-text="'Versión '+r.id+' · '+v3Date(r.created_at)"></strong><ol><template x-for="q in v3Parse(r.questions)"><li x-text="q"></li></template></ol></article></template><template x-for="r in v3Aux" :key="r.ticket_id"><article class="v3-card"><strong x-text="r.ticket_code+' · Versión '+r.version_id"></strong><template x-for="(q,i) in v3Parse(r.questions)"><p x-text="q+': '+v3Parse(r.answers)[i]+'/5'"></p></template></article></template></div></template>
 <template x-if="v3Tab==='survey'&&v3Detail"><div><p x-show="v3Detail.answered">Ya respondiste esta encuesta.</p><template x-for="(q,i) in v3Parse(v3Detail.questions)"><label><span x-text="q"></span><select x-model.number="v3Answers[i]" :disabled="v3Detail.answered"><option value="1">1 · Muy insatisfecho</option><option value="2">2 · Insatisfecho</option><option value="3">3 · Neutral</option><option value="4">4 · Satisfecho</option><option value="5">5 · Muy satisfecho</option></select></label></template><button class="btn btn-green" :disabled="v3Detail.answered" @click="v3AnswerSurvey()">Enviar respuestas</button></div></template>
 <template x-if="v3Tab==='competencies'"><div><label>Técnico<select x-model="v3SkillUser" @change="v3ChooseSkills()"><option value="">Selecciona</option><template x-for="t in v3Techs"><option :value="t.user_id" x-text="t.first_name"></option></template></select></label><template x-for="c in v3Categories"><label class="v3-check"><input type="checkbox" :value="String(c.category_id)" x-model="v3SkillIds"><span x-text="c.category_name"></span></label></template><p>Al guardar sin especialidades, el técnico queda excluido de nuevas asignaciones automáticas.</p><button class="btn btn-green" @click="v3SaveSkills()">Guardar competencias</button></div></template>
 <template x-if="v3Tab==='availability'&&v3Availability"><div><p x-text="'Última actualización: '+v3Date(v3Availability.updated_at)+' · WebSocket · Actualización cada 15 segundos'"></p><p role="alert" class="v3-warning" x-show="!v3Availability.rows.some(t=>t.online)">Mesa de ayuda sin cobertura: no hay técnicos conectados.</p><template x-for="t in v3Availability.rows" :key="t.user_id"><article class="v3-card"><strong x-text="t.first_name"></strong><p :class="t.carga>=3?'v3-error':t.carga===2?'v3-warning':'v3-success'" x-text="(t.online?'Conectado':'Desconectado')+' · '+t.carga+' tickets En curso'+(t.carga>=v3Availability.threshold?' · Saturado':' · Capacidad disponible')+(t.en_vacaciones?' · En vacaciones':'')"></p><p x-text="'Última actividad: '+(t.last_seen?v3Date(t.last_seen):'Sin actividad reciente')"></p></article></template></div></template>
 <template x-if="v3Tab==='travel'"><div><p>Valida la llegada escaneando el QR del área. Los traslados mayores a 60 minutos requieren justificación.</p><label>Código leído del QR del área<input x-model="v3Form.qr" placeholder="CLINICA-AREA:…" autocomplete="off"></label><label>Justificación (si supera 60 minutos)<textarea x-model="v3Form.justification" maxlength="1000"></textarea></label><button x-show="usuario?.permisos==='si'" class="btn btn-outline" @click="v3AreaQR()">Generar QR del área para imprimir</button><template x-if="v3Detail?.qr"><div class="v3-card"><strong x-text="v3Detail.piso+' · '+v3Detail.area"></strong><img :src="v3Detail.qr" alt="QR del área" width="240"><p>Imprime este QR y ubícalo en el área indicada. Un lector QR puede ingresar el código en el campo de llegada.</p><code x-text="v3Detail.payload"></code></div></template><button class="btn btn-green" @click="v3Travel('start')">Iniciar traslado</button> <button class="btn btn-outline" @click="v3Travel('arrive')">Registrar arribo</button><p x-show="!v3Rows.length">Sin traslados registrados.</p><template x-for="r in v3Rows" :key="r.id"><article class="v3-card"><strong x-text="r.first_name"></strong><p class="v3-warning" x-show="r.observed">Marcación observada: ubicación distinta del ticket.</p><p x-show="r.justification" x-text="r.justification"></p><p x-text="'Inicio: '+v3Date(r.started_at)"></p><p x-text="r.arrived_at?'Arribo: '+v3Date(r.arrived_at)+' · '+r.seconds+' segundos':'En desplazamiento'"></p></article></template></div></template>
 <template x-if="v3Tab==='backup'&&v3Detail"><article class="v3-card"><strong x-text="v3Detail.exists?'Respaldo local disponible':'Sin respaldo local registrado'"></strong><p>Los errores se guardan en un archivo local cuando no es posible escribir en la base de datos.</p><p x-show="v3Detail.exists" x-text="'Última escritura: '+v3Date(v3Detail.updated_at)"></p><p x-show="v3Detail.exists" x-text="'Tamaño del respaldo: '+v3Detail.bytes+' bytes'"></p><p>El contenido técnico se conserva para diagnóstico y no se muestra en esta vista.</p></article></template>
 <template x-if="v3Tab==='integrationActivity'&&v3Detail"><div><template x-for="(m,i) in v3Detail.messages" :key="i"><article class="v3-card v3-inbox"><strong x-text="m.outcome==='ignored'?'Mensaje descartado: remitente no registrado':'Solicitud recibida por correo'"></strong><p x-text="v3Date(m.created_at)"></p><p x-show="m.outcome!=='ignored'" x-text="m.receipt_sent?'Acuse entregado al servicio de correo':'Acuse de correo pendiente'"></p><p x-text="m.outcome==='ignored'?'No se generó un ticket para este mensaje.':('Ticket generado: '+m.receipt_code)"></p></article></template><template x-for="(u,i) in v3Detail.users" :key="i"><article class="v3-card v3-directory-user"><strong x-text="u.first_name"></strong><p>Cuenta vinculada al directorio institucional</p><p x-text="'Área: '+(u.operational_area||'Sin indicar')"></p><p x-text="'Cargo: '+(u.job_title||'Sin indicar')"></p><p x-text="u.user_status?'Cuenta activa':'Cuenta deshabilitada'"></p></article></template><p x-show="!v3Detail.messages.length&&!v3Detail.users.length">No hay actividad registrada.</p></div></template>
 </fieldset>
</section></div>
